name: Publish to PyPI

on:
  push:
    tags:
      # Release tags are python-v<version> (e.g. python-v0.3.0).
      - "python-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#python-v}"
          pkg="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          echo "tag=$tag pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $pkg"
            exit 1
          fi

      - name: Run the test suite
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r test-requirements.txt
          pip install -e .
          pytest -q

      - name: Build package
        run: |
          pip install build twine
          python -m build

      - name: Check the distribution
        run: twine check --strict dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
