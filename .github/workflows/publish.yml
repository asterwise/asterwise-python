name: Publish to PyPI

# Trusted Publishing: PyPI accepts uploads only from this workflow
# (asterwise/asterwise-python, publish.yml, environment "pypi") using a
# short-lived GitHub OIDC token. There is no PyPI API token anywhere.
#
# The "pypi" environment only accepts python-v* tags and waits for an
# approval from the asterwise account before the publish job runs.

on:
  push:
    tags:
      # Release tags are python-v<version> (e.g. python-v0.3.0).
      - "python-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#python-v}"
          pkg="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          echo "tag=$tag pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $pkg"
            exit 1
          fi

      - name: Run the test suite
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r test-requirements.txt
          pip install -e .
          pytest -q

      - name: Build package
        run: |
          pip install build twine
          python -m build

      - name: Check the distribution
        run: twine check --strict dist/*

      - name: Keep the built files for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    # Only this job can mint the OIDC token, and only after the environment
    # approval. It runs no project code: it uploads the files built above.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/asterwise/
    permissions:
      id-token: write
    steps:
      - name: Fetch the built files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
